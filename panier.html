<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Mon Panier - Katana Store</title>
</head>
<body class=" bg-gradient-to-t from-red-400 to-gray-700 font-sans text-white min-h-screen flex flex-col">

  <nav class="bg-gray-900 px-6 py-4 shadow-md flex justify-between items-center fixed top-0 w-full z-50">
    <a href="index.html" class="text-2xl font-black hover:text-gray-400 transition">Katana Store</a>
    <a href="index.html#collection" class="font-bold text-gray-300 hover:text-white">Continuer mes achats</a>
  </nav>

  <main class="flex-grow max-w-5xl mx-auto w-full pt-28 pb-20 px-6">
    <h1 class="text-4xl font-black mb-10">Mon Panier</h1>

    <div class="flex flex-col lg:flex-row gap-10">
      <div class="lg:w-2/3 bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
        <div id="cart-container" class="flex flex-col gap-6">
        </div>
      </div>

      <div class="lg:w-1/3 bg-gray-900 p-6 rounded-2xl shadow-lg border border-gray-700 h-fit">
        <h2 class="text-2xl font-bold mb-6 border-b border-gray-700 pb-4">Résumé</h2>
        <div class="flex justify-between mb-4 text-gray-300">
          <span>Sous-total</span>
          <span id="subtotal">0 €</span>
        </div>
        <div class="flex justify-between mb-6 text-gray-300">
          <span>Frais de port</span>
          <span>Gratuit</span>
        </div>
        <div class="flex justify-between items-center mb-8 border-t border-gray-700 pt-4">
          <span class="text-xl font-bold">Total</span>
          <span id="total-price" class="text-3xl font-black text-red-500">0 €</span>
        </div>
        <button onclick="checkout()" class="w-full bg-red-600 text-white font-bold py-4 rounded-lg hover:bg-red-700 transition shadow-lg">
          Procéder au paiement
        </button>
      </div>
    </div>
  </main>

  <!-- Lien vers le fichier JavaScript -->
  <script src="panier.js"></script>
</body>
</html>
